name: VSMR architecture tests

on:
  push:
    branches: [dev, feature/continual-vsmr-peft]
  pull_request:
    branches: [dev]

jobs:
  vsmr-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchvision==0.17.2
          python -m pip install timm==0.6.12 numpy==1.26.4 pillow tqdm
      - name: Compile VSMR implementation
        run: |
          python -m py_compile train.py models/base/continual_vsmr.py models/base/continual_vsmr_metrics.py models/base/continual_vsmr_model.py models/base/continual_vsmr_trainer.py models/base/vsmr_modules.py models/base/vsmr_losses.py models/base/vsmr_resynthesis.py models/base/vsmr_diagnostics.py
      - name: Test single Prompt and incremental freeze contract
        run: |
          cd tests
          PYTHONPATH=.. python -m unittest test_continual_vsmr.TestVSMRPromptArchitecture.test_single_prompt_and_incremental_parameter_contract -v
      - name: Test cached and direct Prompt context equivalence
        run: |
          cd tests
          PYTHONPATH=.. python -m unittest test_continual_vsmr.TestVSMRPromptArchitecture.test_projected_context_matches_raw_context -v
      - name: Test VSMR prototype utilities
        run: |
          cd tests
          python -m unittest test_continual_vsmr.TestVSMRPrototypeUtilities -v
      - name: Test VSMR synthetic training pipeline
        run: |
          cd tests
          python -m unittest test_continual_vsmr.TestVSMRSyntheticPipeline -v
      - name: Run VSMR metrics tests
        run: python -m unittest discover -s tests -p 'test_continual_vsmr_metrics.py' -v
      - name: Run legacy VSMR tests
        run: |
          python -m unittest discover -s tests -p 'test_vsmr.py' -v
          python -m unittest discover -s tests -p 'test_vsmr_diagnostics.py' -v
